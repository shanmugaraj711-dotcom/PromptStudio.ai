name: Optimize Preview Test

on:
  push:
    branches:
      - api/gpt-optimize-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check preview deployment
        env:
          PREVIEW_URL: https://prompt-studio-ai-git-api-gpt-optimize-v1-prompt-studioai.vercel.app
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "$PREVIEW_URL/api/v1/optimize" \
            -H 'Content-Type: application/json' \
            --data '{"prompt":"write a product launch post","target":"ChatGPT"}')
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if(typeof r.optimized_prompt!=="string" || !r.optimized_prompt || typeof r.score!=="number" || typeof r.link!=="string") process.exit(1)' "$response"
