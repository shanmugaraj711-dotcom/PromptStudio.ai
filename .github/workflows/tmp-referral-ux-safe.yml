name: Temporary referral UX patch

on:
  push:
    branches:
      - feature/referral-ux-safe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe referral UX patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('api/admin.js')
          text = admin.read_text()
          old = 'const config = await getReferralConfig(db); const referrals = await db.collection("referrals").where("referrerUid", "==", user.uid).get(); return json(res, 200, { code, ...config, referrals: referrals.docs.map((d) => ({ id: d.id, status: d.data().status || "completed", createdAt: d.data().createdAt || null })) });'
          new = 'const config = await getReferralConfig(db); const [asReferrer, asReferee] = await Promise.all([db.collection("referrals").where("referrerUid", "==", user.uid).get(), db.collection("referrals").where("refereeUid", "==", user.uid).get()]); const referrals = [...asReferrer.docs.map((d) => ({ id: d.id, role: "referrer", status: d.data().status || "completed", referrerReward: Number(d.data().referrerReward || 0), refereeReward: Number(d.data().refereeReward || 0), createdAt: d.data().createdAt || null, completedAt: d.data().completedAt || null })), ...asReferee.docs.map((d) => ({ id: d.id, role: "referee", status: d.data().status || "completed", referrerReward: Number(d.data().referrerReward || 0), refereeReward: Number(d.data().refereeReward || 0), createdAt: d.data().createdAt || null, completedAt: d.data().completedAt || null }))]; return json(res, 200, { code, ...config, referrals });'
          if text.count(old) != 1: raise SystemExit(f'admin anchor count={text.count(old)}')
          admin.write_text(text.replace(old, new, 1))

          app = Path('src/App.jsx')
          text = app.read_text()
          old_import = 'import Referral from "./pages/Referral/Referral";'
          new_import = 'import Referral from "./pages/Referral/Referral"; import ReferralRewardToast from "./components/referral/ReferralRewardToast";'
          if text.count(old_import) != 1: raise SystemExit('App import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old_end = '<PaymentSuccessToast /></>; }'
          new_end = '<PaymentSuccessToast /><ReferralRewardToast /></>; }'
          if text.count(old_end) != 1: raise SystemExit('App end anchor missing')
          app.write_text(text.replace(old_end, new_end, 1))

          signup = Path('src/pages/Auth/Signup.jsx')
          text = signup.read_text()
          old_apply = 'const applyReferral = async () => { if (!referralCode || !auth.currentUser) return; try { const token = await auth.currentUser.getIdToken(); await fetch("/api/admin?action=referral-public", { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({ code: referralCode }) }); } catch (err) { console.warn("Referral attribution failed", err); } };'
          new_apply = 'const applyReferral = async () => { if (!referralCode || !auth.currentUser) return null; try { const token = await auth.currentUser.getIdToken(); const response = await fetch("/api/admin?action=referral-public", { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({ code: referralCode }) }); const body = await response.json().catch(() => ({})); if (!response.ok) return null; if (!body.alreadyRewarded && body.referral?.status === "completed") window.dispatchEvent(new CustomEvent("promptstudio:referral-reward", { detail: { side: "referee", credits: Number(body.referral.refereeReward || 0) } })); return body; } catch (err) { console.warn("Referral attribution failed", err); return null; } };'
          if text.count(old_apply) != 1: raise SystemExit('Signup anchor missing')
          signup.write_text(text.replace(old_apply, new_apply, 1))

          referral = Path('src/pages/Referral/Referral.jsx')
          referral.write_text('''import React, { useEffect, useMemo, useState } from "react";\nimport { useAuth } from "../../context/AuthContext";\n\nexport default function Referral() {\n  const { user } = useAuth();\n  const [data, setData] = useState(null); const [busy, setBusy] = useState(true); const [error, setError] = useState(""); const [copied, setCopied] = useState(false); const [shared, setShared] = useState(false);\n  useEffect(() => { let active = true; (async () => { try { const token = await user?.getIdToken(); const res = await fetch("/api/admin?action=referral-public", { headers: { Authorization: `Bearer ${token}` } }); const body = await res.json(); if (!res.ok) throw new Error(body.message || "Could not load referral rewards."); if (active) setData(body); } catch (e) { if (active) setError(e.message || "Could not load referral rewards."); } finally { if (active) setBusy(false); } })(); return () => { active = false; }; }, [user]);\n  const link = useMemo(() => data?.code ? `${window.location.origin}/signup?ref=${encodeURIComponent(data.code)}` : "", [data?.code]);\n  const successfulReferrals = data?.referrals?.filter((item) => item.status === "completed" && item.role === "referrer").length || 0;\n  const creditsEarned = data?.referrals?.filter((item) => item.status === "completed" && item.role === "referrer").reduce((sum, item) => sum + Number(item.referrerReward || 0), 0) || 0;\n  const copy = async () => { if (!link) return; await navigator.clipboard.writeText(link); setCopied(true); window.setTimeout(() => setCopied(false), 1800); };\n  const share = async () => { if (!link) return; const text = `🚀 I'm using PromptStudio.ai to turn reference images into powerful AI prompts.\\n\\nJoin through my referral link and get ${data?.refereeCredits || 5} bonus credits 🎁`; try { if (navigator.share) { await navigator.share({ title: "Join PromptStudio.ai", text, url: link }); setShared(true); window.setTimeout(() => setShared(false), 1800); } else { await navigator.clipboard.writeText(`${text}\\n\\n${link}`); setShared(true); window.setTimeout(() => setShared(false), 1800); } } catch (err) { if (err?.name !== "AbortError") setError("Could not open the share sheet. You can copy the link instead."); } };\n  if (busy) return <div className="rounded-3xl border border-gray-800 bg-gray-900 p-8 text-sm text-gray-300">Loading your referral rewards…</div>;\n  if (error) return <div className="rounded-3xl border border-red-500/30 bg-red-950/30 p-6 text-sm text-red-200">{error}</div>;\n  return <section className="rounded-3xl border border-indigo-500/30 bg-gradient-to-br from-indigo-950/70 via-gray-900 to-violet-950/60 p-6 shadow-2xl sm:p-8"><div className="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between"><div className="max-w-2xl"><p className="text-xs font-black uppercase tracking-[0.18em] text-indigo-300">Referral rewards</p><h2 className="mt-2 text-2xl font-black text-white">Give credits. Grow PromptStudio.ai.</h2><p className="mt-2 text-sm leading-6 text-gray-300">Invite a new creator with your personal link. When a new account qualifies, the configured reward is credited automatically to both accounts.</p></div><div className="grid grid-cols-2 gap-3 text-center"><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><p className="text-xs font-bold uppercase text-gray-400">You earn</p><p className="mt-1 text-2xl font-black text-white">{data?.enabled ? data.referrerCredits : "—"}</p><p className="text-[10px] text-gray-400">credits per referral</p></div><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><p className="text-xs font-bold uppercase text-gray-400">Friends earn</p><p className="mt-1 text-2xl font-black text-white">{data?.enabled ? data.refereeCredits : "—"}</p><p className="text-[10px] text-gray-400">welcome credits</p></div></div></div>{data?.enabled ? <><div className="mt-6 rounded-2xl border border-white/10 bg-black/20 p-4"><label className="text-[11px] font-black uppercase tracking-[0.16em] text-gray-400">Your personal referral link</label><div className="mt-2 flex flex-col gap-2 sm:flex-row"><input readOnly value={link} aria-label="Referral link" className="min-w-0 flex-1 rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-xs text-gray-200 outline-none" /><div className="flex gap-2"><button onClick={copy} type="button" className="flex-1 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-black text-white hover:bg-white/10 sm:flex-none">{copied ? "Copied ✓" : "Copy link"}</button><button onClick={share} type="button" className="flex-1 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-black text-white hover:bg-indigo-500 sm:flex-none">{shared ? "Shared ✓" : "Share invite"}</button></div></div><p className="mt-2 text-[11px] text-gray-500">Share opens your device's native share sheet, so available apps such as WhatsApp, Instagram, Telegram, Messages and Gmail appear automatically.</p></div><div className="mt-5 grid gap-3 sm:grid-cols-2"><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><p className="text-xs font-bold uppercase text-gray-400">Successful referrals</p><p className="mt-1 text-2xl font-black text-white">{successfulReferrals}</p></div><div className="rounded-2xl border border-white/10 bg-white/5 p-4"><p className="text-xs font-bold uppercase text-gray-400">Credits earned</p><p className="mt-1 text-2xl font-black text-white">{creditsEarned}</p></div></div><p className="mt-4 text-[11px] text-gray-500">Rewards are controlled by the PromptStudio founder. One reward is granted per referred account.</p></> : <div className="mt-6 rounded-2xl border border-amber-500/30 bg-amber-950/30 p-4 text-sm text-amber-100">Referral rewards are temporarily unavailable.</div>}</section>;\n}\n''')

          Path('src/components/referral').mkdir(parents=True, exist_ok=True)
          Path('src/components/referral/ReferralRewardToast.jsx').write_text('''import { useEffect, useState } from "react";\nimport { Link } from "react-router-dom";\nimport { useAuth } from "../../context/AuthContext";\n\nexport default function ReferralRewardToast() {\n  const { user } = useAuth(); const [reward, setReward] = useState(null);\n  useEffect(() => { const onReward = (event) => { if (event.detail?.credits > 0) setReward(event.detail); }; window.addEventListener("promptstudio:referral-reward", onReward); return () => window.removeEventListener("promptstudio:referral-reward", onReward); }, []);\n  useEffect(() => { if (!user) return undefined; let active = true; (async () => { try { const token = await user.getIdToken(); const response = await fetch("/api/admin?action=referral-public", { headers: { Authorization: `Bearer ${token}` } }); const body = await response.json().catch(() => ({})); if (!response.ok || !active) return; const latest = (body.referrals || []).filter((item) => item.role === "referrer" && item.status === "completed").sort((a, b) => new Date(b.completedAt || b.createdAt || 0) - new Date(a.completedAt || a.createdAt || 0))[0]; if (!latest?.id) return; const key = `promptstudio:referral-seen:${user.uid}`; const seen = localStorage.getItem(key); if (seen === latest.id) return; localStorage.setItem(key, latest.id); if (Number(latest.referrerReward || 0) > 0) setReward({ side: "referrer", credits: Number(latest.referrerReward) }); } catch (_) {} })(); return () => { active = false; }; }, [user]);\n  if (!reward) return null;\n  return <div className="fixed inset-x-4 bottom-5 z-[80] mx-auto max-w-lg rounded-3xl border border-indigo-200 bg-white p-5 text-slate-900 shadow-2xl shadow-indigo-900/15 sm:inset-x-auto sm:right-6 sm:mx-0"><div className="flex gap-4"><div className="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-indigo-100 text-xl">🎁</div><div className="min-w-0 flex-1"><div className="flex items-start justify-between gap-3"><div><p className="text-base font-black">Referral reward credited</p><p className="mt-0.5 text-sm text-slate-600">+{reward.credits} credits added to your wallet.</p></div><button type="button" onClick={() => setReward(null)} className="text-slate-400 hover:text-slate-700" aria-label="Close referral reward notification">✕</button></div><p className="mt-3 text-xs text-slate-500">Your referral was successfully completed and the reward has been recorded.</p><div className="mt-4 flex flex-wrap gap-2"><Link to="/transactions" onClick={() => setReward(null)} className="rounded-xl bg-blue-600 px-3.5 py-2.5 text-xs font-black text-white hover:bg-blue-500">View transaction</Link><Link to="/referral" onClick={() => setReward(null)} className="rounded-xl border border-slate-200 px-3.5 py-2.5 text-xs font-black text-slate-700 hover:bg-slate-50">View referrals</Link></div></div></div></div>;\n}\n''')

          transactions = Path('src/pages/Transactions/Transactions.jsx')
          transactions.write_text('''import { useEffect, useState } from "react";\nimport { useAuth } from "../../context/AuthContext";\n\nconst formatDate = (value) => value ? new Date(value).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—";\n\nexport default function Transactions() {\n  const { user } = useAuth(); const [items, setItems] = useState([]); const [loading, setLoading] = useState(true); const [error, setError] = useState("");\n  useEffect(() => { let active = true; const load = async () => { try { const token = await user?.getIdToken(); const headers = { Authorization: `Bearer ${token}` }; const [paymentResponse, referralResponse] = await Promise.all([fetch("/api/razorpay-verify", { headers }), fetch("/api/admin?action=referral-public", { headers })]); const paymentBody = await paymentResponse.json().catch(() => ({})); const referralBody = await referralResponse.json().catch(() => ({})); if (!paymentResponse.ok) throw new Error(paymentBody.message || "Unable to load transactions."); const referralItems = referralResponse.ok ? (referralBody.referrals || []).filter((item) => item.status === "completed").map((item) => ({ id: `referral:${item.id}:${item.role}`, kind: "referral", role: item.role, credits: Number(item.role === "referee" ? item.refereeReward : item.referrerReward) || 0, status: "completed", createdAt: item.createdAt, completedAt: item.completedAt })) : []; if (active) setItems([...(paymentBody.transactions || []), ...referralItems].sort((a, b) => new Date(b.paidAt || b.completedAt || b.createdAt || 0) - new Date(a.paidAt || a.completedAt || a.createdAt || 0))); } catch (err) { if (active) setError(err.message || "Unable to load transactions."); } finally { if (active) setLoading(false); } }; if (user) load(); return () => { active = false; }; }, [user]);\n  const getHelp = (transaction) => { window.dispatchEvent(new CustomEvent("promptstudio:open-support", { detail: { message: transaction.kind === "referral" ? `I need help with my referral reward. Credits: ${transaction.credits}. Referral ID: ${transaction.id}. Status: ${transaction.status}. Date: ${formatDate(transaction.completedAt || transaction.createdAt)}.` : `I need help with my transaction. Amount: ₹${transaction.amountInr}. Credits: ${transaction.credits}. Status: ${transaction.status}. Order ID: ${transaction.orderId}. Payment ID: ${transaction.paymentId || "not available"}. Date: ${formatDate(transaction.paidAt || transaction.createdAt)}.` } })); };\n  return <div className="min-h-[calc(100vh-4.5rem)] bg-slate-50 px-4 py-8 sm:px-6 lg:px-8"><div className="mx-auto max-w-5xl"><div className="mb-7"><p className="text-xs font-black uppercase tracking-[0.18em] text-blue-600">Billing</p><h1 className="mt-2 text-3xl font-black tracking-tight text-slate-950">Transactions</h1><p className="mt-2 text-sm text-slate-500">Your verified purchases, credits and referral rewards.</p></div>{error && <div className="mb-5 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">{error}</div>}{loading ? <div className="rounded-2xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">Loading your transactions…</div> : items.length === 0 ? <div className="rounded-2xl border border-slate-200 bg-white p-10 text-center"><div className="text-3xl">💳</div><h2 className="mt-3 text-lg font-black text-slate-900">No transactions yet</h2><p className="mt-1 text-sm text-slate-500">Your verified purchases and referral rewards will appear here.</p></div> : <div className="space-y-4">{items.map((item) => item.kind === "referral" ? <article key={item.id} className="rounded-2xl border border-emerald-200 bg-emerald-50/70 p-5 shadow-sm sm:p-6"><div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><div><div className="flex flex-wrap items-center gap-2"><span className="text-lg font-black text-slate-950">+{item.credits} credits</span><span className="rounded-full bg-emerald-100 px-2.5 py-1 text-[11px] font-black uppercase text-emerald-700">completed</span></div><p className="mt-1 text-sm font-bold text-slate-700">{item.role === "referrer" ? "Referral reward" : "Referral welcome bonus"}</p><p className="mt-1 text-xs text-slate-500">{formatDate(item.completedAt || item.createdAt)}</p></div><button type="button" onClick={() => getHelp(item)} className="rounded-xl border border-emerald-200 bg-white px-4 py-2.5 text-xs font-black text-emerald-700 hover:bg-emerald-50">Get help →</button></div><div className="mt-4 grid gap-3 border-t border-emerald-100 pt-4 text-xs sm:grid-cols-2"><div><span className="font-bold text-slate-500">Referral ID</span><p className="mt-1 break-all font-mono text-slate-700">{item.id}</p></div><div><span className="font-bold text-slate-500">Status</span><p className="mt-1 text-slate-700">Reward credited successfully</p></div></div></article> : <article key={item.id} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><div className="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"><div><div className="flex flex-wrap items-center gap-2"><span className="text-lg font-black text-slate-950">₹{item.amountInr}</span><span className={`rounded-full px-2.5 py-1 text-[11px] font-black uppercase ${item.status === "paid" ? "bg-emerald-100 text-emerald-700" : item.status === "failed" ? "bg-red-100 text-red-700" : "bg-amber-100 text-amber-700"}`}>{item.status}</span></div><p className="mt-1 text-sm font-bold text-slate-700">{item.credits} credits · {item.packId}</p><p className="mt-1 text-xs text-slate-500">{formatDate(item.paidAt || item.createdAt)}</p></div><button type="button" onClick={() => getHelp(item)} className="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2.5 text-xs font-black text-blue-700 hover:bg-blue-100">Get help with this transaction →</button></div><div className="mt-4 grid gap-3 border-t border-slate-100 pt-4 text-xs sm:grid-cols-2"><div><span className="font-bold text-slate-500">Order ID</span><p className="mt-1 break-all font-mono text-slate-700">{item.orderId}</p></div><div><span className="font-bold text-slate-500">Payment ID</span><p className="mt-1 break-all font-mono text-slate-700">{item.paymentId || "Not available"}</p></div></div></article>)}</div>}</div></div>;\n}\n''')

          workflow = Path('.github/workflows/tmp-referral-ux-safe.yml')
          workflow.unlink()
          PY

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git status --short
          git add api/admin.js src/App.jsx src/pages/Auth/Signup.jsx src/pages/Referral/Referral.jsx src/pages/Transactions/Transactions.jsx src/components/referral/ReferralRewardToast.jsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: polish referral sharing and reward visibility"
          git push origin HEAD:feature/referral-ux-safe
